services:
  # PocketBase 后端服务（数据库 + 认证 + API）
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: wl-ai-director-pb
    ports:
      - "8090:8090"
    volumes:
      - ./pb_data:/pb_data
      - ./pb_migrations:/pb_data/pb_migrations
    command: serve --http=0.0.0.0:8090 --dir=/pb_data --publicDir=/pb_public --hooksDir=/pb_hooks --migrationsDir=/pb_data/pb_migrations
    restart: unless-stopped
    networks:
      - cinegen-network

  # 前端 Nginx 服务
  bigbanana-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wl-ai-director-app
    ports:
      - "3005:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - cinegen-network

networks:
  cinegen-network:
    driver: bridge
